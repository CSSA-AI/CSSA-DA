services:
  postgres:
    image: pgvector/pgvector:0.7.4-pg16
    container_name: rag_postgres_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: rag_user
      POSTGRES_PASSWORD: rag_password
      POSTGRES_DB: rag_vectordb
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U rag_user -d rag_vectordb"]
      interval: 10s
      timeout: 5s
      retries: 5

  postgres-test:
    image: pgvector/pgvector:0.7.4-pg16
    container_name: rag_postgres_test
    profiles: ["test"]
    environment:
      POSTGRES_USER: test
      POSTGRES_PASSWORD: test
      POSTGRES_DB: testdb
    ports:
      - "5433:5432"
    tmpfs:
      - /var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U test -d testdb"]
      interval: 5s
      timeout: 5s
      retries: 5

  api-cpu:
    image: cssa-da-api:latest
    build:
      context: .
      dockerfile: Dockerfile.api
    container_name: rag_api_cpu
    profiles: ["cpu"]
    restart: unless-stopped
    depends_on:
      migrate-cpu:
        condition: service_completed_successfully
    ports:
      - "8000:8000"
    environment:
      ENV: ${ENV:-dev}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      CHAT_API_KEY: ${CHAT_API_KEY:-}
      DATABASE_URL: postgresql://rag_user:rag_password@postgres:5432/rag_vectordb
      # The image has no .env file (.dockerignore excludes it), so rate
      # limits are tunable in production only if compose passes them in.
      CHAT_RATE_LIMIT: ${CHAT_RATE_LIMIT:-10/minute}
      CHAT_GLOBAL_RATE_LIMIT: ${CHAT_GLOBAL_RATE_LIMIT:-500/day}
    volumes:
      - huggingface_cache:/root/.cache/huggingface

  migrate-cpu:
    # Migrations run from the API image (alembic is in the shared core).
    image: cssa-da-api:latest
    build:
      context: .
      dockerfile: Dockerfile.api
    container_name: rag_migrate_cpu
    profiles: ["cpu", "pipeline"]
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      disable: true
    entrypoint: ["python", "-m", "alembic"]
    command: ["upgrade", "head"]
    environment:
      DATABASE_URL: postgresql://rag_user:rag_password@postgres:5432/rag_vectordb

  pipeline-cpu:
    image: cssa-da-pipeline:latest
    build:
      context: .
      dockerfile: Dockerfile.pipeline
    profiles: ["pipeline"]
    depends_on:
      migrate-cpu:
        condition: service_completed_successfully
    healthcheck:
      disable: true
    command: ["--help"]
    environment:
      PYTHONUTF8: "1"
      PYTHONUNBUFFERED: "1"
      WECHAT_API_KEY: ${WECHAT_API_KEY:-}
      DATABASE_URL: postgresql://rag_user:rag_password@postgres:5432/rag_vectordb
    volumes:
      - ./data:/app/data
      - huggingface_cache:/root/.cache/huggingface

volumes:
  pgdata:
  huggingface_cache:
