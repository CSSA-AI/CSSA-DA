services:
  postgres:
    image: pgvector/pgvector:0.7.4-pg16
    container_name: rag_postgres_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: rag_user
      POSTGRES_PASSWORD: rag_password
      POSTGRES_DB: rag_vectordb
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U rag_user -d rag_vectordb"]
      interval: 10s
      timeout: 5s
      retries: 5

  postgres-test:
    image: pgvector/pgvector:0.7.4-pg16
    container_name: rag_postgres_test
    profiles: ["test"]
    environment:
      POSTGRES_USER: test
      POSTGRES_PASSWORD: test
      POSTGRES_DB: testdb
    ports:
      - "5433:5432"
    tmpfs:
      - /var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U test -d testdb"]
      interval: 5s
      timeout: 5s
      retries: 5

  api-cpu:
    build:
      context: .
      dockerfile: Dockerfile.cpu
    container_name: rag_api_cpu
    profiles: ["cpu"]
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "8000:8000"
    environment:
      ENV: ${ENV:-dev}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      DATABASE_URL: postgresql://rag_user:rag_password@postgres:5432/rag_vectordb
    volumes:
      - huggingface_cache:/root/.cache/huggingface

  api-gpu:
    build:
      context: .
      dockerfile: Dockerfile.gpu
    container_name: rag_api_gpu
    profiles: ["gpu"]
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "8000:8000"
    environment:
      ENV: ${ENV:-dev}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      DATABASE_URL: postgresql://rag_user:rag_password@postgres:5432/rag_vectordb
    volumes:
      - huggingface_cache:/root/.cache/huggingface
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]

volumes:
  pgdata:
  huggingface_cache:
