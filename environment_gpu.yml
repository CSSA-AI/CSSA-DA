# =============================================================================
# Data Science / notebook environment (GPU) - NOT a deployment artifact.
#
# Same purpose as environment_cpu.yml but with a CUDA (cu118) PyTorch build for
# data scientists who fine-tune models on a GPU machine. It is NOT used for
# deployment - production images are built from Dockerfile.api /
# Dockerfile.pipeline against pyproject.toml + uv.lock (CPU inference).
#
# Versions are deliberately mostly unpinned for experimentation. When
# reproducible fine-tuning is needed (e.g. golden tests), lock this with
# conda-lock and align the ML core with the versions pinned in uv.lock.
# =============================================================================
name: cssa-ai
channels:
  - conda-forge
  - defaults
dependencies:
  - python=3.11.12
  - git
  - mypy
  - matplotlib
  - numpy
  - pandas
  - ipykernel
  - jupyter
  - scikit-learn
  - pytest
  - nltk
  - gensim
  - ipython
  - transformers
  - tqdm
  - pip
  - pip:
    # CUDA 11.8 PyTorch build for GPU fine-tuning
    - --extra-index-url https://download.pytorch.org/whl/cu118
    - torch
    - torchaudio
    - torchvision
    - sentence_transformers
    - accelerate==1.6.0
    - peft
    - rank-bm25==0.2.2
    - discopy

    - langchain
    - langchain-community
    - langchain-text-splitters
    - langchain-openai        # ChatGPT generator backend
    - tiktoken                # Token counting
    - openai

    - trafilatura
    - langdetect
    - hanzidentifier
    - bs4
    - requests

    # === Backend API (Platform Squad) ===
    - fastapi                 # REST API framework
    - uvicorn[standard]       # API server
    - slowapi                 # /chat rate limiting (protect the OpenAI bill)
    - python-multipart        # Form / file upload support
    - pydantic
    - pydantic-settings       # .env configuration

    # === Database (Postgres) ===
    - sqlalchemy              # ORM
    - alembic                 # Database schema migrations
    - asyncpg                 # Async driver
    - psycopg2-binary         # Sync driver
    - pgvector                # pgvector support

    # === Demo ===
    - python-dotenv           # Load environment variables
