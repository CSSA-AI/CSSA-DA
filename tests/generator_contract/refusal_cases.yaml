      Overview Availability Semester 1 - On Campus Fees Look up fees This unit is designed for students with little or no background in chemistry who wish to gain an understanding of basic chemistry. Topics covered include the nature of matter, solutions and gases, the chemical change related to equilibrium, energy and kinetics, and the nature of redox processes; and structures and functional groups of inorganic molecules. In introducing the nature of matter and the chemical elements, an elementary discussion of atomic structure and the bonding of elements to form compounds is given. Further development requires a discussion of the mole concept. This leads to a study of chemical reactions, with discussions on oxidation and reduction, acids and bases, energy changes in reactions, reaction rates and chemical equilibrium, and an introduction to organic chemistry. Intended learning outcomes This aim of this subject is to provide students with an understanding of: Nature of matter: elements, atoms, ion and molecules Electronic structure of atoms and ions Bond formation including covalent, ionic metallic, hydrogen bonding, van der Waal’s Solubility and solution state; ions and hydration The behaviour of gases The mole concept, concentrations and stoichiometry Acids, bases neutralisation reactions and salt formation Acid/base strength and the pH scale Energy and chemical systems Rates of reaction and reaction order Catalysis and enzymes Chemical equilibrium; the equilibrium, constant, Ka Kb stability constants and solubility products Redox reactions and redox potentials Organic molecules: structure nomenclature and functional groups Hydrophobicity and hydrophilicity Biologically significant macromolecules Generic skills This subject encompasses particular generic skills so that on completion of the subject students should have developed skills relating to: The organisation of
