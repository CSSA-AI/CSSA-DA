- id: wechat-student-visa-work-hours
  query: 持学生签证在澳洲打工，每两周最多可以工作多少小时？
  why: The one clause stating the cap (40 hours a fortnight in 2017; 48 since 2023) was cut. The article is still about work rights and visa conditions, and the model knows the current rule -- this is the fill-in-from-memory case.
  anchors:
  - 签证
  - 打工
  withheld:
  - '40'
  - '48'
  context:
  - question: 拒绝被剥削！在澳洲打工，你一定要知道这些事情
    text: |-
      拒绝被剥削！在澳洲打工，你一定要知道这些事情快，关注这个公众号，一起涨姿势～在澳洲打工，你有被老板占过便宜吗？比如说克扣工资、被不公平对待还有要求你做非法的事情。“之前，澳洲的最大连锁店7-11以及马来西亚餐厅Papparich就被爆出剥削留学生的丑闻。媒体报道，很多7-11的员工只能拿到10澳元的税前工资，2/3的连锁店对内欺诈员工，对外掩盖剥削行为。而Papparich餐厅也被报道向层在店里工作的留学生支付仅每小时13澳元的工资，然而法律规定应是至少21澳元。去年澳洲太阳先驱报就报道过，某连锁寿司店压榨中国留学生。这名中国学生小马，在墨尔本这家寿司店工作了5个小时，最后没有拿到一分钱报酬，老板只给了她4个寿司卷。小马说，老板一开始说每小时工资10澳元，后来又改口说她没有经验，必需无薪学习一段时间，仅仅用寿司代替工资。有法律界人士表示，不少留学生对澳洲相关法律并不了解，不知道自己应有的工作权利。所以有些不良雇主会根据这一点欺骗甚至威胁留学生，比如说如果学生敢投诉，雇主就会告发他们，那么学生就会被驱逐出境。然而，剥削的行为还不止这些。所以，为了保护自己的权益，大家在打工之前，还是要了解清楚澳洲相关的法律规定。我们请教了维州社区法律中心专门负责处理工作权益事务的律师Gabrielle Marchetti，让他来给大家讲讲这方面的主要问题。“什么是劳动剥削？”如果你的雇主没有向你支付合法工资或者有违反澳洲劳动法的行为，那就是劳动剥削。这主要包括：1\. 没有提供午餐时间2\. 要求必须现金支付你的工资（也就是说，你并不在公司的正式员工名单里）3\. 要求你违反签证的规定4\. 让你在不安全的工作环境下劳动5\. 没有带薪病假和年假“什么是法定最低工资？”法定最低工资就是法律规定雇主必须向雇员支付的最低工资标准。这一标准是根据你的就业类型（如临时员工、兼职、全职）以及劳资裁定（或者劳动合同）。兼职员工工作时间在每周38小时以内的，应该每周规定固定工作时间，同时享受全职员工的待遇。如果没有任何带薪病假获年假，并且每周工作时间不固定，那你应当是临时员工。劳资裁定和企业协议文件里应当注明你的最低工作条件。劳资裁定需说明你作为员工可以享受哪些权利，企业协议里说明对你的雇主的要求。在维多利亚州，如果你未满21岁，那你的最低工资会依据年龄有所调整。比如说：20岁 兼职员工 最低工资：17.29澳元/小时临时员工 最低工资：21.62澳元/小时19岁 兼职员工 最低工资：14.62澳元/小时临时员工 最低工资：18.25澳元/小时18岁 兼职员工 最低工资：12.09澳元/小时临时员工 最低工资：15.11澳元/小时如果你已年满21岁，兼职员工最低工资应为17.70澳元/小时，临时员工最低工资应为22.13澳元/小时。如果在周末、晚上、公众假日工作或者加班，你都可以获得更多的报酬。这些标准仅适用于维多利亚州，澳大利亚其他地区的标准会根据当地情况有所不同。如果你想要知道你的工作最低工资标准，可以拨打公平工作咨询电话131394了解，或者登录以下网址搜索。https://calculate.fairwork.gov.au/findyouraward“什么是公平工作调查专员署？”平等工作调查专员署（Fair Work Ombudsman，简称FWO）是澳洲独立政府机构，致力于确保每个人都能遵守公平工作法案和澳洲工作相关法律，其中包括每个人在工作中应当受到公平对待。如果你觉得自己在工作中被剥削或工资低于法定标准，你可以…1\. 拨打FWO电话1313942\. 如果你住在维多利亚州，可以向国际学生工作权益法律服务中心（ International Students Work Rights Legal Service）预约免费、保密的法律咨询。你只需要发送Email到info@studymelbourne.vic.gov.au即可完成预约。你向公平工作调查专员署（FWO）或者国际学生工作权益法律服务中心反映的工作问题，不会影响到你的签证。公平工作调查专员署是政府资助独立机构，原则上不会向其他政府部门（如移民局）泄露你的个人信息或者工作时间。国际学生工作权益法律服务中心不属于政府机构，所以他们掌握的信息是完全保密的。也就是说，你向这两所机构透露的信息只会用于帮助你维护工作权益，而并不会泄露给第三方机构。公众号ID：cssaum 墨尔本大学中国学生会想要知道更多墨尔本的咨询长按识别右侧二维码，关注我们哟～😉更多互动 尽在我们的官方新浪微博:@墨尔本大学中国学生会
    source: 'WeChat: 墨大中国学生会'
    link: https://mp.weixin.qq.com/s/mtmjo-iR93wnHgpp1xh1tg
    post_date: '2017-04-16'
