  - question: 【CSSA推荐】墨大新生选课指南，看这一份攻略就够了!
    text: |-
      【CSSA推荐】墨大新生选课指南，看这一份攻略就够了!墨大的Summer Term马上就要开始了～有不少同学选择利用暑期继续进修，大家是否已经安排好了自己的课表呢？CSSA小可爱为大家献上超全选课功略，赶紧来查收吧！内容目录01重要日期02选课步骤03学长贴士04缴费方式Census Dates重要截止日期SUMMER&S1Preference Entry Period: 选课开放于11月15号-12月13号,11.59pm(AEDT). （Summer选课仅在此期限内！）Class Timetable Preference Entry Period: 课程表时间选择开放于11月23号,10am-12月7号,8am(AEDT)Class Timetable Review and Adjust Period: 课表调整于12月9号,10am(AEDT)开始Late Re-enrolment Period: 12月14号-1月10号,11.59pm(AEDT)。该时间段仅为s1课程注册的最后期限。如果在该期间提交选课申请，需要额外缴纳 117AUD 的费用。Fee Payment Due Date:\- Summer Term付费截止于1月14号\- Semester 1付费截止于2月15号Cancellation Period:Census Date: Withdraw还可以退学费的最后期限。具体日期需查看该课程的handbookLast date to withdraw without fail: Withdraw不能退学费，但不计分。具体日期需查看该课程的handbookTimetable Planning选课小帖士01 计划期登录MyTimetable上的Planner，根据学分要求，计划接下来的课表。https://prod.ss.unimelb.edu.au/student/SM/StudyPlanDtls10.aspx?r=%23UM.STUDENT.APPLICANT&f=%24S1.EST.STUDYPLN.WEB02 选课期成功Enrol并在课表时间开放以后，MyTimetable的Preference中会显示大家所选科目的所有上课时间。同学们可以按照自己的时间规划，给不同的课时按志愿排序。在每个选项右边能看到对应的爆满程度，更高的百分比意味着这个课时更难被选上。Note：所有科目的选课必须在截止日期前完成，否则，只能在调整期间（Adjustment Period）开始后选择剩余有空位的课时。03 调整期在调整期间开始后，MyTimetable中的Timetable上会显示分配好的课表。同时，每个课时也会显示以下几种状态：● Allocated: 目前被分配到的课时● Select: 可更改到的课时● Clash: 此课时跟自己另外一门课的课时冲突● Problem: 此课时不匹配● Full: 此课时已满若想调整之前被分配到的课表，可以从Select里面任意选择或从Full里面提交调换申请（Swap Request），若这个课时出现了空位，系统会自动将你调换过去。Tips学长小贴士01 日常必备软件VPN需要在国内上网课的同学，可以根据学校官网的VPN安装流程去安装VPN，直接在官网搜索VPN access from China即可，这能够保证你们的课程流畅度哦。如下图所示：LMSLMS（https://canvas.lms.unimelb.edu.au/）是学校日常学习中使用最频繁的网址，同学们可以下载它的App，在手机上查看学科的最新通知与成绩。Gmail下载一个Gmail App能够及时地收到来自同学老师的邮件以及学校通知哦。02 参与线下课程1）根据学校的要求，首先需要在入学前填写一份健康声明，链接:https://unimelb.service-now.com/student?id=health\_check2）其次，完成COVID-Safe Campus Online Training Module. 这个Module需要登陆Trainme,链接: https://uomtrainme.elmotalent.com.au/，搜索Covid并enrol 后开始学习。声明和module只需要学习一次。
