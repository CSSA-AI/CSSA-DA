  - question: 【CSSA活动】猫鼠风云来啦！
    text: |-
      【CSSA活动】猫鼠风云来啦！猫鼠风云{ 校园策略博弈 }Catch and Run在校园的角落里悄然潜伏着两股力量——猫与鼠。你的任务是什么？是隐藏、是追捕，亦是联合伙伴完成秘密使命？在《猫鼠风云》中，每一次行动都可能改变战局，每一次决策都关乎胜负。_【CSSA活动预告】_ 猫鼠风云·校园策略博弈阵营对抗·追逐混战·团队协作《CSSA猫鼠风云》即将火热上线！专为CSSA学生打造的沉浸式互动体验：动态身份与阵营：你是狡猾的老鼠🐀，还是敏锐的猫🐱？不同角色，策略大不同！多变任务与规则： 在不断变化的挑战中，你需要判断、思考、合作，才能取得最终胜利！社交与团队互动：结交新朋友，丰富校园生活。不论你是否是墨大学生，只要你想加入，都欢迎来体验这场猫鼠大战！无论是紧张学业中的娱乐放松还是 结识新朋友，这场“猫鼠风云”绝对不容错过！游戏规则游戏基本信息 游戏时长：90分钟玩家人数：30人身份分布：猫阵营：6人鼠阵营：24人游戏开始前通过抽签决定身份猫阵营的同学需穿颜色背心鼠阵营同学需贴上号码牌猫阵营 在90分钟内尽可能抓捕老鼠。鼠阵营躲避猫的抓捕，并通过完成任务帮助阵营获得优势基础玩法猫阵营：淘汰老鼠方法：猫选手需要用手拍到鼠选手身体即算抓捕成功猫可以通过完成任务小游戏 获得特殊技能用来帮助抓捕老鼠技能获得后仅该猫玩家本人可以使用鼠阵营鼠需要在场地中：躲避猫，👣寻找任务卡完成小游戏任务（游戏内设立有多个任务点）完成任务后可能获得一些能力，例如：限制猫的行动帮助复活队友被抓到的老鼠需要前往补给站（淘汰区）等待。鼠医身份 游戏中有一种特殊身份：鼠医游戏开始时设有2名鼠医场地中还隐藏有医生身份卡普通老鼠找到后也可以成为鼠医鼠医能力：如果鼠医与一名鼠合作完成任务 可以复活一只已被淘汰的鼠。每名鼠医的复活能力只能使用一次补给站（安全区域） 地图中设有补给站补给站内规则：鼠在补给站内不能被猫抓捕但停留时间不能超过5分钟同时补给站也是淘汰区和复活区胜负判定 游戏时间：90分钟如果在游戏结束前：猫成功抓捕 ≥20只老鼠➡️ 猫阵营获胜如果猫抓捕数量 <20只➡️ 鼠阵营获胜游戏结束后工作人员会根据记录进行统计并公布结果选出MVP奖励设置最佳老鼠（2名）第一名 $30 第二名 $20最佳猫（2名）第一名 $30 第二名 $20最佳兽医（1名）$30积极完成任务，做出突出贡献，你就可能赢得奖金！活动信息时间：3月21日（周六）13：00-16：00地点：墨尔本大学北草坪（north lawn）活动地点温馨提示 游戏期间务必遵守安全规定提前了解活动规则及签署免责协议享受一场轻松又刺激的猫鼠大战！END文案 | 林祎乐Leon排版 | 孟垂含Lydia海报 | 黄崔凡Vicky图片来源 |百度，谷歌地图
