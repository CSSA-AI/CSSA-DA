    text: |-
      【CSSA墨大攻略】快来看看墨尔本交通神器PTV和Myki该怎么使用吧！！！墨城攻略若讨论起人间正事，非衣食住行不可。在前面的推送中，咱们CSSA已经推出过关于墨尔本住宿和美食方面的攻略。今天咱们就聊聊墨村出行。壹介绍1. 墨尔本有三种交通工具，电车（tram），巴士（bus）和火车（train）。墨尔本通用的交通卡为myki。2. myki分为全价票和年票。国际学生可以选择在网上购买搬家的年票iUSEpass（仅限于本科学生）。如果平时不常用交通工具的同学，可以选择充值myki money，随时可以充值任何金额。 贰购买充值1. 在各大火车在售票窗口，7-ELEVEN和myki充值机都可以购买。2. 在以上地点以及网上都可以充值（网上充值可能需要24个小时才显示在卡的余额上。）叁myki使用1. 查看余额（balance）和卡的状态（status）： \ 上下车滴卡时机器会显示 \充值机上会显示 （另会显示卡的无效日期，myki有效期为四年） \蓝色的myki查询机只显示卡的余额和状态，并不会扣钱。1. Touch on and Touch off \巴士和火车：上下车都需要滴卡。 \电车：如果全程在2区（zone 2），上下车都需要滴卡。如果不是，只需上车滴卡。 \注意：如果欠费，滴卡无效。2. 在免费乘车区域（free tram zone）内则无需刷卡 肆PTVPTV是在墨尔本使用的专门用来查询班次的手机应用，在Google play和 App store上只需要搜索下载即可。使用步骤：（步骤1） （步骤二）（步骤三）（步骤四）（步骤五）如果想了解更多信息，请在网站上直接搜索PTV和myki，也可以直接在车站询问工作人员。 前方高能还想了解更多关于墨尔本生活学习的资讯吗？？请扫描下方墨大CSSA小助手的二维码入2018墨大新生互助群（请备注“新生”） （墨大CSSA小助手正室） （墨大CSSA小助手二号）
