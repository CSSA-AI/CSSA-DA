    text: |-
      【CSSA墨城攻略】全是干货，初来墨尔本留学，这些租房事项你必须知道！！！Hello！！！可爱的小仙女小鲜肉学弟学妹们~咱们墨大CSSA欢迎即将到墨尔本的各位在土澳开启你们崭新的学业生活不过初来乍到租房往往是让大家很头疼的一件事情学姐特别提醒大家不要贪便宜或是贪方便建议大家先来墨尔本不了解情况的时候可以短租一两个月房子，再和朋友一起慢慢找合适的房子一起合租下来，不要通过网络这么早就确定下一年长租的房子，谨防被骗。学长学姐自己曾经在租房方面吃过亏，也遇到过很多在这方面吃亏的小盆友们，所以咱们墨大CSSA特意整理出下列租房方面需要特别注意的问题，请大家仔细阅读。前方高能干货来袭！！！壹租赁形式市面上常见的有三种租赁方式，（1）直接和房东签订租赁协议；（2）通过中介进行租赁；（3）同二房东转租。首先，最为推荐的租赁方式是直接通过专业的租房中介进行房屋租赁，好处是安全可靠有保障，与中介签订正式租赁合约可以保障你在租赁期间作为租户的权益，例如中介会承担租赁期间房屋自然损坏的维修工作，同时也避免了房东肆意克扣押金的忧虑。但是，通过中介租房往往手续更为繁杂，需要提交繁杂比如visa，银行的存单，朋友的评价，等等信息。而如果你选择和房东直接签订合约，这种好处是手续比较简单，不需要再提供大量的证明和审核，但是需要注意合同的有效性，尤其是如果没签署有效的合约，无良房东肆意克扣租户押金的事情比比皆是。而通过二房东进行的转租更是不受法律的保护，一旦出现纷争，很可能会吃亏上当，所以大家租房的时候一定要小心谨慎。贰法律保护澳洲租赁方面的有关法案为The Residential Tenancies Act 2010，由公平贸易厅（Office of Fair Trading）监督执行。法案规定了租赁双方的权利义务以及解决纠纷的步骤和仲裁机构（The Consumer, Trader and Tenancy Tribunal）,法案具有强制性，租赁双方必须依法履行相应的权利和业务。 在租赁期间，业主和租客如果产生任何纠纷，如租客延误交租或业主没有对应紧急修缮的部分（如因暴雨造成屋顶漏水）进行处理而造成租客生活的不便，都可通过中介协调解。所以如果是通过中介租到的房子，出了问题别忘了联系中介进行修缮喔～叁押金&租金根据澳洲房屋租赁方面的有关规定，租客在搬入所租物业前（长租）一般需要先交押金（金额通常是一个月的租金），并预付一个月的租金。通过中介进行的租赁一般合约期为一年，这里需要特别注意的是如果通过中介正规渠道完成的租赁，一般中介会提供一张由公平贸易厅统一收取押金时出具的收据给租客，证明押金的收取是具有法律效益的，没有收到的同学要记得进一步和中介确认，索要收据，以防最后出租方抵赖收到过押金，不予退还喔。押金主要用于租赁期间租户对物业造成的非自然损坏所产生的费用进行补偿。如果租客在租约到期并搬出所租物业后，中介会对物业进行检查，并在确认无损坏的情况下，由公平贸易厅将押金退还给租客。如物业并未发现任何房屋损毁，同时租户没有违反租约中的任何条例，中介无权克扣租房押金，需悉数退还给租户。如果就退还押金方面双方存在争议，可致电UMSU法律援助中心寻求帮助与建议。肆合约条例租房合约往往十分冗长，但请一定要仔细阅读，合约书里会详细规定租户和房主的权利与业务，租户需遵循合约中的所有约束。例如退房前需要做的清洁工作（部分物业会要求地毯的蒸汽清洁），如有违反，可能会导致押金被合理扣除。同时，你还需注意一些可能会损伤你作为租户个人利益的一些条款，例如房东可否在租赁期间内交易租赁房产，一旦卖出，是否有权利在合同存续期间内提前终止租赁合约。五Condition report入住前中介往往会和你签署一份Inspection Record Form的房屋状况纪录表，请不要忘了详细检查房屋的状况是否符合表内所述，并于7天内退回给中介。这点十分重要，假如你的inspection record form中显示空调是working perfectly,但你检查的时候发现是坏的，记得一定要标明，并和中介说清楚，不然之后如果退房时是坏的，尽管你租赁期间内未使用过，但责任方会是你而非房东。所以仔细标注出所有不符合的地方，并提醒中介及时修缮租赁前已经有损耗的部分可以帮助你避免日后的纷争。 陆转租&分租如果你是通过中介整租了一套房子，建议最好和其他分租的室友一起找中介签订租房合约。
    source: 'WeChat: 墨大中国学生会'
    link: https://mp.weixin.qq.com/s/R3AkhbAKmBe9X19ohsB02g
    post_date: '2019-07-09'
