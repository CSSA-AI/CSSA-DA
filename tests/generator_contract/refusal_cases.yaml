  - question: 【CSSA活动】沙滩排球活动预告
    text: |-
      【CSSA活动】沙滩排球活动预告BEACH VOLLEYBALL\[CSSA 活动预告\]Beach Volleyball夏日沙滩排球友谊赛报名开启一起去海边开打!就在 3月28日，CSSA 将为大家带来一场阳光、海风与运动激情并存的沙滩排球友谊赛！本次活动将在 South Melbourne Beach 举行，我们希望为在墨尔本学习和生活的中国学生搭建一个健康、积极、充满活力的交流平台。在这里，你不仅可以感受 沙滩排球的竞技魅力，还可以在海边阳光下释放学习压力、结识新朋友、体验不一样的留学生活。无论你是经验丰富的排球高手，还是想尝试新运动的朋友，都欢迎加入我们，一起在沙滩上挥洒汗水、享受比赛的乐趣！比赛组别🏐 双打（女子/男子/混双都可以）比赛说明BEACH VOLLEYBALL一、参赛装备比赛用沙滩排球由CSSA统一提供二、竞赛办法与计分 初赛、1/4决赛、半决赛：采取15-15-11分制，三局两胜 决赛：采取21-21-15分制，三局两胜三、赛程安排小组赛(90 min)1 vs 23 vs 45 vs 67 vs 8\_\_9 vs 1011 vs 1213 vs 1415 vs 16\_4强(45 min)1 vs 23 vs 45 vs 67 vs 8\_半决赛 (45 min)1 vs 23 vs 4\_\_\_决赛(45 min)1 vs 2\_L vs L(季军)\_\_四、裁判与赛务 现场设立裁判组与积分台、负责判罚、计分与赛务组织，确保比赛 公开、公平、公正 出现争议时，以主裁判判定为最终结果奖金设置预计会有16只队伍,取前三名队伍作为获胜队伍。PRIZES第一名：150 AUD第二名：100 AUD第三名： 50 AUD除了比赛奖金外，现场还会准备饮料、能量补给与纪念物资，让大家在比赛之余也能享受轻松愉快的活动氛围。活动信息⏰活动时间 3月28日 2：00 – 7：00 PM📍活动地点 South Melbourne Beach💵报名费用 CSSA会员 AUD 10/人 非CSSA会员 AUD 15/人🧾缴费方式 Account name: Society Cheque AcctBSB: 063238Account Number: 10831208缴费成功后，请填写报名表并提供缴费证明给负责人✋🏻报名条件墨尔本在读学生都可以报名参加📱报名方式请扫描下方二维码参与活动报名啦！！！成功报名的朋友们请加入报名表最后的活动大群，及时获取比赛信息一起去海边打球吧！在这里，我们不仅比拼球技，更传递友谊至上、公平竞技的体育精神。阳光、沙滩、排球、海风，还有一群热爱运动的朋友。无论输赢，你都将收获 快乐、友谊与难忘的回忆！这个夏天，一起去海边开打！3月28日，South Melbourne Beach，不见不散！🏐🌊·END·⽂案｜潘柳烨、黄子衿排版｜杨希蕾 Celia海报｜李秉轩CSSA
    source: 'WeChat: 墨大中国学生会'
