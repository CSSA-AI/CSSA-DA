  context:
  - question: 【CSSA推荐】恭喜墨大海归，回国直接领3w!
    text: |-
      【CSSA推荐】恭喜墨大海归，回国直接领3w!DBC职梦 DBC职梦 🎓墨大留学生请注意：墨大作为世界顶尖名校之一，2026 QS世界大学位列第19名，在国内职场具备极强竞争力，备受头部企业青睐。今年海归人才补贴重磅升级：北京现金最高补贴15w、上海创业补贴50W、深圳不落户也能领3w......身为墨大海归，你可能需要这些信息： 墨大海归能领取哪些福利补贴？ 哪些国内名企更偏爱墨大海归？ 如何界定墨大留学生的应届生身份？\ 针对存在问题，重磅推出海归资源群。入群你将获得墨大小助手实时播报澳洲&国内最新岗位，包含Intern、远程实习、Events、应届生项目等。。\群内播报截图还有更重要的信息差：内推岗位。这类仅群内可见的资源，是你在官网无法获取的机会。\群内截图此外，入群的墨大同学还可获得： 独家校友内推资源 价值$2000 高薪求职资料库 …01墨大独家校友内推资源群内集结Deloitte、PwC、EY等在职学长学姐，为墨大 New Grad开放专属简历内推筛选通道，对接HR会优先筛选。\群内岗位截图02墨大专属高薪求职礼包群内共享最适合墨大留学生的求职资料，包括： 最新岗位网申汇总表（更新至2.10） 700套中文简历真人模板 国内投行、商行、四大、互联网最新网测题 面试必备BQ&Suggested Answer 国内20+城市落户政策&学历认证攻略 国内租房、买房、创业等海归人才补贴指南 最新CFA/FRM/CPA备考大礼包扫码回复【海归】入群与墨大校友抱团交流！ ▼▼▼
