- id: wechat-recruitment-interview-date
  query: CSSA 2026 招新的面试是哪天？在哪里面试？
  why: The recruitment post gives the application deadline, not the interview date or place.
  anchors:
  - 招新
  withheld: []
  context:
  - question: 2026墨大中国学生会招新开启！
    text: |-
      2026墨大中国学生会招新开启！原创 CSSA 2026 新学期招新开启报名截止时间：3 月 6 日 23点 亲爱的新同学&重返校园的伙伴： 新学期的校园，正在慢慢苏醒。 课堂之外，你是否也在寻找一个地方—— 能把热情落到实处，把想法变成现实， 把“我可以试试”变成“原来我真的可以”。 现在， 墨尔本大学中国学生会（CSSA） 新学期招新正式开启。 这里不仅是一个学生组织， 更是一群人一起把事情做好、 把成长走实的地方。 在 CSSA，你可以 ➡️参与策划覆盖数百甚至上千人的校园 与大型活动，站在真正的执行一线。 ➡️用文字、影像和创意，记录属于这一代留学生 的真实故事。 ➡️在对外合作与资源沟通中建立信任, 理解真实世界的 运作方式。 ➡️在不断的协作与磨合中， 学会沟通、决策与承担责任。 ➡️围绕学习与成长做内容与项目， 把经验与信息整理成真正对同学有用的输出, 把想法交给团队，把结果留给时间。 我们不要求你一开始就“什么都会”。 只希望你愿意投入、愿意学习、 愿意为一件事情认真走一段路。 无论你是擅长策划与统筹的“思考型选手”， 还是热衷执行、行动力拉满的“实干派”， CSSA 都希望为你留下一席 可以成长、被看见、被信任的位置。 如果你期待在墨大 留下些什么真正属于自己的经历， 那么，我们很期待在 CSSA 与你相遇。CSSA介绍CSSA 成立于 2003年，是一个非宗教、非政治、非营利性质的学生社团。我们的初衷很简单：为墨尔本大学及墨尔本地区的中国留学生与华人学者，提供学习与生活上的支持与帮助，让大家在异国求学的过程中，少一些迷茫，多一些连接与陪伴。 简单来说，CSSA更像是大家在异国他乡的一位贴心伙伴。我们关注同学们在学习、生活、融入与成长过程中的真实需求，致力于帮助大家更快适应校园生活，结识志同道合的朋友，在学业之外，也拥有丰富而有温度的大学体验。目前，我们总共有六个部门，分别是：组织部、外联部、宣传部、学术部、人力资源部和信息技术部。不同背景、不同兴趣的同学，都能在这里找到适合自己的位置，与一群认真做事的人一起，把想法落到实处。主席寄语 大学不仅是“完成学业的过程”，它更是一段逐渐认识自己、也不断与他人产生连接的旅程。CSSA 的存在，正是希望在这段旅程中，给每一位同学多一些支持、陪伴与可能性。 在CSSA，你会拥有一个可以参与、可以尝试、也可以被信任的空间。你会在真实的项目与团队协作中，学会把想法落地、把问题解决，也逐渐建立起对自己能力的信心。CSSA 希望带给你的，不只是更丰富的大学生活，更是一段能够持续影响你未来的成长过程。这些经历，往往比结果本身更重要。如果你愿意把一部分时间交给这样一段经历，也愿意和一群认真、真诚的人一起把事情做好，欢迎你加入我们，我们一起，走的更远。 2026届主席 伍朝晖SandyCSSA主席团介绍（左滑查看更多）组织部招新要求 组织部是 CSSA 的“幕后大脑”，负责策划、统筹并推动各类对外活动从想法到落地。我们将天马行空的创意转化为可执行的方案，在协调人力与流程中解决问题、推进进度。这里既有重构现实的执行力，也有彼此支持的凝聚力——靠谱做事，但从不孤军奋战。部门核心精神：热情+创造+责任+活力=欢乐=组织部！ 部门核心职能：组织部参与活动创意构思与方案设计，对活动进行细心策划与统筹安排，并推动想法高效落地实施。我们需要这样的你我们希望你：➡️责任心强、做事细心➡️有执行力，能把想法变成行动➡️擅长沟通与协调➡️有团队意识在这里你能收获：➡️组织月统筹能力的实战提升➡️与不同部门高效合作的经验➡️清晰的工作逻辑与时间管理能力➡️认识一群频率相同、无话不谈的好朋友宣传部招新要求 宣传部作为CSSA的“形象大使”与“发声筒”，宣传部负责将墨大的每一场活动、每一条资讯，用最具创意的方式传递给墨尔本的中国留学生。我们是故事的讲述者，也是视觉的造梦人。通过新媒体、影像与设计，让大家更好的了解墨大。部门口号：“让每一次发声，都掷地有声。”团队氛围：宣传部是一个充满欢声笑语的创意乐园。这里有从小白一路成长起来的排版高手，有第一次拿起相机就能拍出大片的摄影新星，也有从零开始玩转设计的海报达人。我们不设限、不嫌慢——学长学姐手把手教学，从秀米排版到PS修图，从构图技巧到配色心法，只要你愿意学，我们就愿意教。一起 brainstorming 时奶茶不断，一起拍摄时笑声不停，一起赶稿时音乐相伴。在这里，技能和友谊，都是从零开始的惊喜。
    source: 'WeChat: 墨大中国学生会'
    link: https://mp.weixin.qq.com/s/yOWdLrJug66ARp_66XGBkg
    post_date: '2026-02-23'
