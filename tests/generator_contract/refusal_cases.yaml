# Refusal contract cases -- ROADMAP_rag.md Phase 3.1, issue #103.
#
# Each case is a question and a context that is RELEVANT but does not contain
# the answer: the handbook pages of the right subject minus the one page that
# answers it, or the WeChat post about the right thing minus the detail asked
# for. That is the shape production actually sees, and the one where a model
# is most tempted to fill the gap itself. A context about something unrelated
# would be trivially easy to refuse and would prove nothing.
#
# The text is verbatim from data/unimelb_subjects_2026.json and
# data/wechat_articles_processed.json, frozen here on 2026-09-22 so a
# re-scrape cannot change the test underneath it. Each item is under
# generator.context.max_chars_per_item, so what is stored is what the model
# is shown.
#
#   anchors   terms from the question that the context must contain -- what
#             makes it relevant. Checked by tests/unit/test_refusal_cases.py.
#   withheld  the answer the context was built without, or the one the model
#             is likely to know anyway. Must not appear in the query or the
#             context (checked), and must not appear in the answer (judged).
#   why       what was removed, and what makes the case a trap.

