  - question: 【CSSA学术】周六『雅拉讲堂』26S1第三期：蛋白质专题讲座！
    text: |-
      【CSSA学术】周六『雅拉讲堂』26S1第三期：蛋白质专题讲座！YARRABRIDGE雅拉讲堂蛋白质专题26S1 第三期scholars@cssaunimelb.com如何让蛋白质发光？蛋白质不只是静止的结构？如何用数据理解渐冻症？2026年4月11日 周六墨尔本大学Arts West第三期 详细信息本专题将带你从“看见蛋白质”出发，走进一个不断变化的分子世界，并进一步揭示它们如何在疾病中发挥作用，解码生命运作背后的分子逻辑！日期：周六 4月11日时间：下午14:00 - 15:00地点：墨尔本大学 Arts West - 353 (Interactive Cinema Space)地图指引：https://maps.unimelb.edu.au/point?identifier=PAR;148A;3;353注册方式：添加下方小助手微信，告诉他们你想参加『雅拉讲堂』。我们也欢迎直接到场walk in！_本场活动提供茶歇。_本期议程 Agenda：14:00-14:20 第一节：马士琨14:20-14:40第二节：陈晓旭14:40-15:00 第三节：刘璇INTRODUCTION我们是谁？学术部和雅拉讲堂墨大CSSA学术部成立于25S1，由博士生主导，同时欢迎本科生和研究生加入或主讲。学术部致力于打造一个面向墨尔本地区学生学者的高水准学术平台，并拓展至纵向师生社群与横向校友网络。部门工作和部员培养涉及演讲、主持、研讨、会务、接待和学术支持等事务。雅拉讲堂（YARRABRIDGE）是学术部的常规线下活动，聚焦学术探讨与知识科普，并延伸至院校交流与就业创业等主题。讲堂内容注重通识性与普适性，讲演语言为中文普通话。每期常规时长1小时，分为三节各20分钟，形式包括讲座、访谈与研讨会。2025年共举办了17期「雅拉讲堂」。_点击Logo查看往期讲堂活动总回顾_每期回放将在我们的YouTube频道上发布https://www.youtube.com/@yarrabridgeCHAPTERS分节详情第一节：讲座GFP:如何点亮细胞的黑暗角落主讲人：马士琨墨尔本大学CSSA学术部副部长，墨尔本大学生物化学和药理学系 PhD Candidate，研究方向为染色质结构和荧光显微镜方法，当前工作聚焦于异染色质蛋白的自聚合对染色质结构的调控作用，在墨尔本大学获得生物医学科学硕士学位以及理学学士学位。本节摘要 Abstract在分子生物学进程中，实时观察活体蛋白曾是巨大瓶颈。本次讲座将以绿色荧光蛋白 (Green Fluorescent Protein, GFP) 为核心，探讨它如何从一种自然发光现象，演变为人类探索微观世界的标准工具。我们将回顾从 20 世纪 60 年代的手工提取到 90 年代实现基因转入的关键历史，并重点讨论科学家如何通过精确修改蛋白质结构 (如定点突变) 来调控其发光特性，将单一绿光扩展为涵盖全光谱的“生命调色盘”，旨在展示人类如何通过分子层面的微观调控重新设计观察工具，将生物研究带入多色彩、定量的动态分析时代。第二节：讲座蛋白质从来不只是一个结构主讲人：陈晓旭墨尔本大学化学院与Bio21研究所PhD Candidate，研究方向为蛋白质的结构和分子机制。当前工作聚焦于结核杆菌中几种关键代谢酶，研究它们如何调控碳代谢的分配，从而影响病菌在不同环境下的生存策略。此前于中国科学院大学，获理学学位，期间研究了细胞环境对蛋白质弱相互作用的影响。本节摘要 Abstract蛋白质常被画成精致而稳定的三维结构，但在真实细胞中，它们并不是静止不动的“模型”，而是不断摆动、切换、组装和解离的动态分子机器。本讲座将从几个经典例子出发，介绍蛋白质如何通过构象变化、寡聚化以及弱相互作用来实现功能调控，并讨论为什么“动态”正在成为理解蛋白质机制的关键视角。第三节：讲座从基因到疾病，我们如何用数据理解渐冻症主讲人：刘璇墨尔本大学生物化学与药理学系PhD Candidate，研究方向为生物信息学与系统生物学。致力于通过多组学数据整合与数据驱动方法解析神经退行性疾病的分子机制，重点关注渐冻症（ALS）领域。 本科毕业于中国医科大学生物技术专业，随后在曼彻斯特大学获得生物信息学与系统生物学硕士学位。曾任职于上海欧易生物科技有限公司，担任单细胞生物信息分析师，主要从事高通量组学数据分析及疾病机制研究。
    source: 'WeChat: 墨大中国学生会'
