- id: handbook-econ10006-fee
  query: ECON10006 这门课国际学生的学费是多少？
  why: 'Nothing is removed: the handbook links to a fee lookup instead of stating a fee, and Dates and times talks about tuition fees without an amount.'
  anchors:
