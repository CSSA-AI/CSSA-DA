    text: |-
      Overview Availability May - On Campus Fees Look up fees This subject equips students with the foundations and tools needed for a career in business analytics. The subject has five distinct components discussed below. Computing and Programming for Business Problems Solving problems in business often requires computer programming to manipulate, analyse, and visualise data. This component helps students, with little or no background in computer programming, learn how to design and write programs using a high-level procedural programming language, and to solve problems using these skills. Topics such as cyber security, cyber ethics and privacy regarding the collection of individual data will also be discussed. Data Warehousing Data warehouses are designed to provide organisations with an integrated set of high quality data to support decision-makers. They should support flexible and multi-dimensional retrieval and analysis of data. Topics covered include data warehousing and decision-making, data warehouse design, data warehouse implementation, data sourcing and data quality, on-line analytical processing (OLAP), dashboards, data warehousing for customer relationship management, and case studies of data warehousing practice. Decision Making and Optimisation There are an assortment of mathematical methods to obtain efficient solutions to a large variety of complex business problems. This component helps student formulate a business problem as a mathematical model and then use computational techniques to estimate and solve the model. Topics covered may include decision making under uncertainty, optimal location allocation of resources in business processes, decision trees, linear programming, integer linear programming, and Monte Carlo simulations.
    source: University of Melbourne Handbook 2026
    link: https://handbook.unimelb.edu.au/2026/subjects/busa90500
