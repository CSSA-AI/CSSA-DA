name: Unit Test


on:
  pull_request:
    branches: [main]
  push:
    branches: [main, "feature/**", "dev/**", "chore/**", "fix/**"]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libpq-dev build-essential

      - name: Upgrade pip
        run: python -m pip install --upgrade pip

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install -r requirements-ci.txt

      - name: Create test env file
        run: |
          cp .env.example .env || true
          echo "OPENAI_API_KEY=dummy-key-for-ci" >> .env
          echo "DATABASE_URL=postgresql://test:test@localhost:5432/testdb" >> .env
          echo "WECHAT_API_KEY=dummy-wechat-key-for-ci" >> .env

      - name: Validate runtime config contract
        env:
          DATABASE_URL: postgresql://test:test@localhost:5432/testdb
          OPENAI_API_KEY: dummy-key-for-ci
          WECHAT_API_KEY: dummy-wechat-key-for-ci
        run: |
          python ops/check_config.py --profile api
          python ops/check_config.py --profile pipeline
          python ops/check_config.py --profile harvester

      - name: Run unit tests
        env:
          OPENAI_API_KEY: dummy-key-for-ci
          DATABASE_URL: postgresql://test:test@localhost:5432/testdb
          WECHAT_API_KEY: dummy-wechat-key-for-ci
        run: |
          pytest tests/unit -q
