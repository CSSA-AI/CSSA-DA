name: Unit Test


on:
  pull_request:
    branches: [main]
  push:
    branches: [main, "feature/**", "dev/**", "chore/**", "fix/**"]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libpq-dev build-essential

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - name: Install dependencies
        # --locked fails if uv.lock is out of date with pyproject.toml, so a
        # forgotten `uv lock` can never slip through CI. uv provisions Python
        # 3.11 itself (per requires-python), so no separate setup-python step.
        run: uv sync --locked

      - name: Create test env file
        run: |
          cp .env.example .env || true
          echo "OPENAI_API_KEY=dummy-key-for-ci" >> .env
          echo "DATABASE_URL=postgresql://test:test@localhost:5432/testdb" >> .env
          echo "WECHAT_API_KEY=dummy-wechat-key-for-ci" >> .env

      - name: Validate runtime config contract
        env:
          DATABASE_URL: postgresql://test:test@localhost:5432/testdb
          OPENAI_API_KEY: dummy-key-for-ci
          WECHAT_API_KEY: dummy-wechat-key-for-ci
        run: |
          uv run python ops/check_config.py --profile api
          uv run python ops/check_config.py --profile pipeline
          uv run python ops/check_config.py --profile harvester

      - name: Run unit tests
        env:
          OPENAI_API_KEY: dummy-key-for-ci
          DATABASE_URL: postgresql://test:test@localhost:5432/testdb
          WECHAT_API_KEY: dummy-wechat-key-for-ci
        run: uv run pytest tests/unit -q
