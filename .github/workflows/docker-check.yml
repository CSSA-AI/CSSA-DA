name: Docker Check

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  docker-build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Build CPU image
        run: docker build -f Dockerfile.cpu -t cssa-da:ci .

      - name: Smoke test pipeline CLI
        run: docker run --rm --entrypoint python cssa-da:ci -m pipelines --help

      - name: Smoke test API container
        run: |
          docker run --rm -d --name cssa-da-api -p 8000:8000 -e OPENAI_API_KEY=dummy-key cssa-da:ci
          for attempt in {1..30}; do
            if curl --fail --silent http://localhost:8000/health; then
              exit 0
            fi
            sleep 2
          done
          docker logs cssa-da-api
          exit 1
