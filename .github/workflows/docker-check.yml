name: Docker Check

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  docker-build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Build CPU image
        run: docker build -f Dockerfile.cpu -t cssa-da:ci .