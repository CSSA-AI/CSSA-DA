name: Integration Test

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  integration-test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: pgvector/pgvector:0.7.4-pg16
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: testdb
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U test -d testdb"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libpq-dev build-essential

      - name: Upgrade pip
        run: python -m pip install --upgrade pip

      - name: Install dependencies
        run: |
          pip install -r requirements-ci.txt

      - name: Create test env file
        run: |
          cp .env.example .env || true
          echo "OPENAI_API_KEY=dummy-key-for-ci" >> .env

      - name: Run integration tests
        env:
          RUN_INTEGRATION_TESTS: "1"
          OPENAI_API_KEY: dummy-key-for-ci
          TEST_DATABASE_URL: postgresql://test:test@localhost:5432/testdb
        run: |
          pytest tests/integration -q
