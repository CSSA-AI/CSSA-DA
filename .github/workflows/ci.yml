name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main, "feature/**", "dev/**", "chore/**", "fix/**"]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libpq-dev build-essential

      - name: Upgrade pip
        run: python -m pip install --upgrade pip

      - name: Install project dependencies
        run: |
          pip install pyyaml
          python - <<'PY'
          import yaml
          with open("environment_cpu.yml", "r", encoding="utf-8") as f:
              env = yaml.safe_load(f)

          deps = []
          for dep in env["dependencies"]:
              if isinstance(dep, str) and dep != "pip":
                  if dep.startswith("python="):
                      continue
                  deps.append(dep)
              elif isinstance(dep, dict) and "pip" in dep:
                  deps.extend(dep["pip"])

          with open("requirements-ci.txt", "w", encoding="utf-8") as f:
              for d in deps:
                  f.write(d + "\n")
          PY

          pip install -r requirements-ci.txt

      - name: Create test env file
        run: |
          cp .env.example .env || true
          echo "OPENAI_API_KEY=dummy-key-for-ci" >> .env

      - name: Run tests
        env:
          OPENAI_API_KEY: dummy-key-for-ci
        run: |
          pytest -q