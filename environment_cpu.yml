# =============================================================================
# Data Science / notebook environment (CPU) - NOT a deployment artifact.
#
# Used by data scientists for interactive work in Jupyter and for model
# fine-tuning on their own machines. It intentionally carries heavy dev/notebook
# tooling (jupyter, matplotlib, nltk, gensim, ...) that the production services
# do NOT need.
#
# Deployment does NOT use this file. Production images are built from
# Dockerfile.api / Dockerfile.pipeline against pyproject.toml + uv.lock.
#
# Versions here are deliberately left mostly unpinned so DS can experiment
# freely. When reproducible fine-tuning is needed (e.g. golden tests), lock this
# with conda-lock and align the ML core (torch / transformers /
# sentence-transformers / peft) with the versions pinned in uv.lock so trained
# artifacts load in the production images.
# =============================================================================
name: cssa-ai
channels:
  - conda-forge
  - pytorch
  - defaults
dependencies:
  - python=3.11.12
  - pip
  # Core scientific computing
  - numpy
  - pandas
  - scikit-learn
  - matplotlib
  - tqdm
  # Dev / notebook tooling
  - mypy
  - ipykernel
  - jupyter
  - ipython
  - pytest
  # Deep learning
  - pytorch
  - torchvision
  - torchaudio
  # Text processing
  - nltk
  - gensim

  - pip:
      # --- RAG core components ---
      - sentence_transformers    # Embedding models
      - huggingface_hub          # Model artifact downloads
      - rank-bm25==0.2.2         # Keyword retrieval (BM25)
      - accelerate==1.6.0        # Model acceleration
      - peft                     # LoRA fine-tuning / adapter loading for the reranker

      # --- LangChain stack ---
      - langchain                # Base framework
      - langchain-community      # Community integrations
      - langchain-core           # Core interfaces
      - langchain-openai         # ChatGPT generator backend
      - langchain-text-splitters # Text chunking
      - tiktoken                 # Token counting for the generator

      # --- Backend API (Platform Squad) ---
      - fastapi                  # REST API framework
      - uvicorn[standard]        # API server
      - slowapi                  # /chat rate limiting (protect the OpenAI bill)
      - python-multipart         # Form / file upload support
      - pydantic                 # Data validation
      - pydantic-settings        # .env configuration

      # --- Database (Postgres + pgvector) ---
      - sqlalchemy               # ORM (used by Alembic migrations)
      - alembic                  # Database schema migrations
      - asyncpg                  # Async Postgres driver
      - psycopg2-binary          # Sync Postgres driver
      - pgvector                 # pgvector support

      # --- Ingestion & cleaning (Data Squad) ---
      - trafilatura              # Web article extraction
      - beautifulsoup4           # HTML parsing (bs4)
      - requests                 # HTTP requests
      - langdetect               # Language detection
      - hanzidentifier           # Simplified/traditional Chinese detection

      # --- Demo ---
      - python-dotenv            # Load API keys from .env
